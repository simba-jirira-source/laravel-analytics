name: Feature Request
description: Suggest an idea for Laravel Analytics.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting an improvement. Describe the problem first so we can evaluate fit with the package scope.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What problem does this solve? Who is affected?
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed behaviour
      description: Describe the behaviour you would like to see.
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: Any alternative approaches or workarounds you considered.
    validations:
      required: false

  - type: textarea
    id: compatibility
    attributes:
      label: Backwards compatibility
      description: Would this require breaking changes to configuration, public APIs, or database schema?
    validations:
      required: false

  - type: textarea
    id: context
    attributes:
      label: Additional context
      description: Links, examples, or screenshots that help explain the request.
    validations:
      required: false
